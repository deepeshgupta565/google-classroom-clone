<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body>
   <nav class="navbar">
        <div>
            <button id="bars"><i class="fa-solid fa-bars bars"></i></button>
        </div>
        <div>
            <img src="google-classroom.jpeg" alt="google-classroom" height="50px">
        </div>
        <div>
            <h3>Classroom</h3>
        </div>
        <div>
            <input type="text" placeholder="Search Classes">
        </div>
        <div>
            <button id="add"><i class="fa-solid fa-plus add"></i></button>
        </div>
   </nav>

</html>
