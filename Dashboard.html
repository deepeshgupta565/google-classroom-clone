<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Dashboard.css">
<link rel="stylesheet" href="create-class-form.css">
</head>
<body>
   <nav class="navbar">
        <div>
            <button id="bars"><i class="fa-solid fa-bars bars"></i></button>
        </div>
        <div>
            <img src="google-classroom.jpeg" alt="google-classroom" height="50px">
        </div>
        <div>
            <h3>Classroom</h3>
        </div>
        <div>
            <input type="text" placeholder="Search Classes">
        </div>
        <div>
            <button id="adds"><i class="fa-solid fa-plus add"></i></button>
        </div>
   </nav>
   <div class="dashboard" id="Dashboards">
        <div>
          <button id="home"><i class="fa-solid fa-house icon"></i>Home</button>
        </div>
        <div>
            <button id="class"><i class="fa-solid fa-users icon"></i>My Classes</button>
        </div>
        <div>
            <button id="assign"><i class="fa-solid fa-rectangle-list icon"></i>Assignment</button>
        </div>
        <div>
            <button id="Calender"><i class="fa-solid fa-calendar-days icon"></i>Calender</button>
        </div>
        <div>
            <button id="people"><i class="fa-solid fa-user icon"></i>People</button>
        </div>
   </div>
   <div class="options" id="option">
        <div>
            <button id="joinclass">Join Class</button>
        </div>
        <div>
            <button id="createclass">Create Class</button>
        </div>
   </div>
   <div class="modal-overlay" id="createClassModal">
            <div class="create-class-form">
                <div class="modal-header">
                    <h2>Create Class</h2>
                    <button type="button" id="closeModal">&times;</button>
                </div>
                <form action="" class="createClassForm">
                    <div class="input-group">
                        <label for="classname">
                            Class name <span>*</span>
                        </label>
                        <input type="text" id="classname" placeholder="e.g Java Programming">
                    </div>
                     <div class="input-group">
                        <label for="section">
                            Section
                        </label>
                        <input type="text" id="section" placeholder="e.g B.Teach CSE">
                    </div>
                     <div class="input-group">
                        <label for="subject">
                            Subject
                        </label>
                        <input type="text" id="subject" placeholder="e.g javascript">
                    </div>
                     <div class="input-group">
                        <label for="room">
                            Room
                        </label>
                        <input type="text" id="room" placeholder="e.g Lab 101">
                    </div>
                    <div class="modal-buttons">
                        <button type="button" id="cancelBtn">Cancel</button>
                        <button type="button" id="createBtn">Create Class</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="modal-overlays" id="joinClassModel">
            <div class="join-class-form">
                <div class="join-header">
                    <h2>Join Class</h2>
                     <button type="button" id="closeModals">&times;</button>
                </div>
                <FORM class="joinClassForm">
                     <div class="input-group">
                        <label for="code">
                            Class Code <span>*</span>
                        </label>
                        <input type="text" id="code" placeholder="e.g 1001">
                    </div>
                     <div class="modal-buttons">
                        <button type="button" id="cancelBtns">Cancel</button>
                        <button type="button" id="JoinBtn">Join Class</button>
                    </div>
                </FORM>
            </div>
        </div>
        <div class="classcard" id="classcards">

        </div>
        <div class="calender-page" id="showcalender">
            <div class="calender-header">
                <h2>Calender</h2>
                <div class="calender-controls">
                    <button id="prevmonth"><i class="fa-solid fa-chevron-left"></i></button>
                    <h3 id="monthyear">October 2026</h3>
                    <button id="nextmonth"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="calender" id="calenders">
                <div class="day">Sun</div>
                <div class="day">Mon</div>
                <div class="day">Tue</div>
                <div class="day">Wed</div>
                <div class="day">Thu</div>
                <div class="day">Fri</div>
                <div class="day">Sat</div>                
            </div>
        </div>
   <script src="Dashboard.js"></script>
</body>
</html>
